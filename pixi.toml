[workspace]
authors = ["Codex <codex@openai.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "finite-mandlebrot-research"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "python -m pytest tests/"
mojo-smoke = "mojo src/smoke_tests.mojo"
atlas-dataset = "mojo src/atlas_dataset.mojo"
atlas-page = "python tools/atlas/build_page.py"
mojo-build = "mojo build src/smoke_tests.mojo -o .pixi/finite-mandelbrot-smoke"
property = "python tools/exact_arithmetic_property_oracle.py"
regime-audit = "python tools/audit_regime_correspondences.py"
vendored = "python tools/check_vendored_sync.py"

[dependencies]
mojo = "==1.0.0"

[pypi-dependencies]
pytest = "==8.3.5"

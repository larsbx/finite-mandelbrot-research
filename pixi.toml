[workspace]
authors = ["Codex <codex@openai.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "finite-mandelbrot-research"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "python -m pytest tests/"
mojo-smoke = "mojo run -I kernel/mojo -I vendor/mojo kernel/mojo/smoke/smoke_tests.mojo"
atlas-dataset = "mojo run -I kernel/mojo -I vendor/mojo kernel/mojo/entrypoints/atlas_dataset.mojo"
mojo-build = "mojo build -I kernel/mojo -I vendor/mojo kernel/mojo/smoke/smoke_tests.mojo -o .pixi/finite-mandelbrot-smoke"
property = "python reference/python/arithmetic/exact_arithmetic_property_oracle.py"
distribution = "python reference/python/arithmetic/exact_arithmetic_property_oracle.py --distribution"
carrier-density = "python reference/python/c1/carrier_density_profile_reference.py"
regime-audit = "python tools/audit_regime_correspondences.py"
estate-audit = "python tools/audit_estate_layout.py"
vendored = "python tools/check_vendored_sync.py"
ledgers = "python tools/make_ledger.py"
ledgers-check = "python tools/make_ledger.py --check"

[dependencies]
# Mojo 1.0.0 release: every Modular package pinned (tests check against pixi.lock).
mojo = "==1.0.0"
mojo-compiler = "==1.0.0"
mojo-python = "==1.0.0"
mblack = "==26.5.0"

[pypi-dependencies]
pytest = "==8.3.5"

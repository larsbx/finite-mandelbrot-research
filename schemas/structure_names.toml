# Names atlas of the Mandelbrot set: every common name keyed to exact data.
#
# Prose: docs/mandelbrot-structure-names-atlas.md. Checks:
# reference/python/atlas/structure_names_reference.py and
# tests/test_structure_names_atlas.py. Every exact field below is recomputed;
# nothing here is a floating-point position.
#
# name_status: field (standard in the literature) | eponym (after a person)
#              | folk (popular or colloquial; the source says where from)
# Angles are rationals in [0, 1) under doubling; polynomials are integer
# coefficient lists in c, constant term first; intervals are rational.

schema_version = 1


# Structure crosswalk: where the estate's code and data coincide with the atlas.
#
# Each [[occurrence]] names a file in this repository or a sibling repository,
# a literal `anchor` in it (or a `json_row` locator for committed JSON), the
# atlas ids of schemas/structure_names.toml it meets, and the `datum` it shares
# with them, written in the atlas's own fields. A named Julia set answers for
# its parameter. Checks: reference/python/atlas/structure_crosswalk_reference.py;
# generated surface: docs/structure_crosswalk.json (tools/make_structure_crosswalk.py).
#
# relation:  same-datum | computes | contains   (datum required)
#            certifies | attaches | names       (datum optional)
# plane:     kernel | reference | oracle | schema | data | test | doc | experiment | view
# exactness: exact | ball | float | name-only
#
# Convention: this repository counts a critical-orbit type from Q_0 = 0, so its
# (ell, k) has ell one more than the atlas's critical_orbit_type preperiod
# (c = -2 is (2, 1) here and [1, 1] in the atlas). Only atlas fields are compared.

format = "finite-mandelbrot-structure-crosswalk-v1"

# === larsbx/finite-mandelbrot-research ======================================


version = 2
template = "estate-repository-v2"

# SPEC_estate v0.1 §3 fields, then this template's layout sections.

[repo]
id = "finite-mandelbrot-research"
slug = "larsbx/finite-mandelbrot-research"
class = "research"
layer = 3
band = "EXPLORE"
stage = "candidate"           # written by estate CI only (no estate CI ledger exists yet)
inv = []                      # INV families: registration pending
default_branch = "main"

[origin]
decided_by = "proposed"       # agent-authored; the owner adopts it by decision record
chats = []
artifacts = []

[[dep]]
id = "estate-governance"
rev = "0833929ed82d42cf3674a1565681625a9622827b"
pin = "sha256:7dff31575b2834b937395f3ff6f7ce2e2d1d7927b893cf8229c682ad7f3a99d2"

[[dep]]                       # vendored packages, pinned by digest in vendored.toml
id = "finite-math-kernels"
pin = "sha256:59af573b9530e4f2d7b25ac67e016a5c8d07bdafd839e04b241c28c82420e38b"

[exports]
names = []

[layout]
status = "canonical"

[principles]
ordering = ["authority", "domain", "language"]
empty_silos = "forbidden"
cross_language_disagreement = "fail_closed"
generated_surfaces = "derived_only"
vendor_code = "non_local"
experimental_code = "non_authoritative"

# Policy is five root manifests; the tools locate them at the root, so no policy/ silo exists.
[[plane]]
id = "policy"
target = "ESTATE.toml"
authority = "governance"
required = true
current = ["ESTATE.toml", "backend.toml", "claim_governance.toml", "polyglot.manifest.toml", "vendored.toml"]

# Mojo in domain packages under kernel/mojo (include roots: -I kernel/mojo -I vendor/mojo).
[[plane]]
id = "kernel"
target = "kernel"
authority = "canonical_executable"
required = true
current = ["kernel"]

# proof/c1/records.toml is the source; ledger.json is its generated projection.
[[plane]]
id = "proof"
target = "proof"
authority = "claim_state"
required = true
current = ["proof", "ledger.json"]

[[plane]]
id = "reference"
target = "reference"
authority = "non_authoritative_reference"
required = true
current = ["reference"]

[[plane]]
id = "oracles"
target = "oracles"
authority = "non_authoritative_oracle"
required = true
current = ["oracles"]

[[plane]]
id = "experiments"
target = "experiments"
authority = "non_authoritative_experiment"
required = true
current = ["experiments"]

# The polyglot boundary schemas stay in the hidden .polyglot/ scaffold shared across the estate.
[[plane]]
id = "schemas"
target = "schemas"
authority = "contract"
required = true
current = ["schemas"]

[[plane]]
id = "conformance"
target = "tests"
authority = "evidence"
required = true
current = ["tests"]

# vendor/mojo and vendor/python are the roots named in vendored.toml.
[[plane]]
id = "vendor"
target = "vendor"
authority = "pinned_external"
required = true
current = ["vendor"]

[[plane]]
id = "tooling"
target = "tools"
authority = "repository_tooling"
required = true
current = ["tools"]

[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["docs", "README.md", "ARCHITECTURE.md", "MIGRATION.md", "ROADMAP.md"]

[[plane]]
id = "paper"
target = "paper"
authority = "publication"
required = true
current = ["paper"]

[[plane]]
id = "examples"
target = "examples"
authority = "example"
required = true
current = ["examples"]

[[language]]
name = "Mojo"
authority = "canonical"
roles = ["kernel", "finite_proof_checking"]
acceptance_authority = true

[[language]]
name = "Python"
authority = "supporting"
roles = ["audit", "reference", "migration"]
acceptance_authority = false

[[language]]
name = "Julia"
authority = "supporting"
roles = ["oracle", "experiment"]
acceptance_authority = false

[[language]]
name = "Lean"
authority = "supporting"
roles = ["formal_proof_target"]
acceptance_authority = false

[[language]]
name = "Haskell"
authority = "supporting"
roles = ["semantic_reference"]
acceptance_authority = false

[migration]
mode = "boundary_first"
mass_move = false
next = []

version = 1
template = "estate-repository-v1"

[repository]
id = "larsbx/finite-mandelbrot-research"
kind = "research"
lifecycle = "active"
default_branch = "main"
layout_status = "canonical"

[principles]
ordering = ["authority", "domain", "language"]
empty_silos = "forbidden"
cross_language_disagreement = "fail_closed"
generated_surfaces = "derived_only"
vendor_code = "non_local"
experimental_code = "non_authoritative"

# Policy is five root manifests; the tools locate them at the root, so no policy/ silo exists.
[[plane]]
id = "policy"
target = "estate.toml"
authority = "governance"
required = true
current = ["estate.toml", "backend.toml", "claim_governance.toml", "polyglot.manifest.toml", "vendored.toml"]

# Mojo in domain packages under kernel/mojo (include roots: -I kernel/mojo -I vendor/mojo).
[[plane]]
id = "kernel"
target = "kernel"
authority = "canonical_executable"
required = true
current = ["kernel"]

# proof/c1/records.toml is the source; ledger.json is its generated projection.
[[plane]]
id = "proof"
target = "proof"
authority = "claim_state"
required = true
current = ["proof", "ledger.json"]

[[plane]]
id = "reference"
target = "reference"
authority = "non_authoritative_reference"
required = true
current = ["reference"]

[[plane]]
id = "oracles"
target = "oracles"
authority = "non_authoritative_oracle"
required = true
current = ["oracles"]

[[plane]]
id = "experiments"
target = "experiments"
authority = "non_authoritative_experiment"
required = true
current = ["experiments"]

# The polyglot boundary schemas stay in the hidden .polyglot/ scaffold shared across the estate.
[[plane]]
id = "schemas"
target = "schemas"
authority = "contract"
required = true
current = ["schemas"]

[[plane]]
id = "conformance"
target = "tests"
authority = "evidence"
required = true
current = ["tests"]

# vendor/mojo and vendor/python are the roots named in vendored.toml.
[[plane]]
id = "vendor"
target = "vendor"
authority = "pinned_external"
required = true
current = ["vendor"]

[[plane]]
id = "tooling"
target = "tools"
authority = "repository_tooling"
required = true
current = ["tools"]

[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["docs", "README.md", "ARCHITECTURE.md", "MIGRATION.md", "ROADMAP.md"]

[[plane]]
id = "paper"
target = "paper"
authority = "publication"
required = true
current = ["paper"]

[[plane]]
id = "examples"
target = "examples"
authority = "example"
required = true
current = ["examples"]

[[language]]
name = "Mojo"
authority = "canonical"
roles = ["kernel", "finite_proof_checking"]
acceptance_authority = true

[[language]]
name = "Python"
authority = "supporting"
roles = ["audit", "reference", "migration"]
acceptance_authority = false

[[language]]
name = "Julia"
authority = "supporting"
roles = ["oracle", "experiment"]
acceptance_authority = false

[[language]]
name = "Lean"
authority = "supporting"
roles = ["formal_proof_target"]
acceptance_authority = false

[[language]]
name = "Haskell"
authority = "supporting"
roles = ["semantic_reference"]
acceptance_authority = false

[migration]
mode = "boundary_first"
mass_move = false
next = []

[governance]
repository = "larsbx/estate-governance"
revision = "bed4af2492dcf17dba2ed03fe429713dc4338da6"

[governance.sha256]
"docs/architecture/estate-repository-template-v1.md" = "30e308be494ac389ff3873cd13b070e22248b44e212c376564d645b6667958ae"
"tools/audit_estate_layout.py" = "c3e17cc08d03b64671f0477635e6c6eee86763ab3301fca936be08b9bd345550"
